# Builds geoguessr-AI-Setup.exe. A tag like v1.0.0 makes a release with it; run by hand, it only
# keeps it as this run's artifact, to try before releasing.
name: Setup

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  UV_VERSION: "0.11.23"

jobs:
  setup:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Get uv
        shell: pwsh
        run: |
          $url = "https://github.com/astral-sh/uv/releases/download/$env:UV_VERSION/uv-x86_64-pc-windows-msvc.zip"
          Invoke-WebRequest $url -OutFile uv.zip
          Expand-Archive uv.zip installer/uv
      - name: Get a Python to bring along
        shell: pwsh
        run: |
          installer/uv/uv.exe python install 3.13 --install-dir pythons --no-bin
          $python = Get-ChildItem pythons -Directory | Where-Object Name -Match '^cpython-3\.13\.\d+' | Select-Object -First 1
          Move-Item $python.FullName installer/python
      # Torch, OpenVINO and the sign reader need Microsoft's C++ runtime, as new as they were built
      # with, and a clean or older Windows hasn't got that. Beside python.exe, they're found first.
      - name: Bring the C++ runtime along
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $crt = Get-ChildItem "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT" -Directory | Sort-Object FullName | Select-Object -Last 1
          Copy-Item "$crt\*.dll" installer/python -Force
          foreach ($needed in "msvcp140.dll", "msvcp140_1.dll", "msvcp140_atomic_wait.dll", "vcruntime140.dll", "vcruntime140_1.dll", "vcruntime140_threads.dll") {
            if (-not (Test-Path "installer/python/$needed")) { throw "No $needed in $crt" }
          }
      - name: Get Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build it
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME.TrimStart("v") } else { "0.0.0" }
          $iscc = (Get-ChildItem "C:\Program Files*\Inno Setup *\ISCC.exe" | Select-Object -First 1).FullName
          & $iscc "/DVersion=$version" installer/geoguessr-AI.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: geoguessr-AI-Setup
          path: installer/Output/geoguessr-AI-Setup.exe
      - name: Release it
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" installer/Output/geoguessr-AI-Setup.exe --title "geoguessr-AI $env:GITHUB_REF_NAME" --notes-file installer/release-notes.md

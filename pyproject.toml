[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "geoguessr-ai"
version = "1.0.0"
description = "A self-trained geolocation AI that plays OpenGuessr by watching your screen and controlling your mouse."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nikhil Kolli" }]
requires-python = ">=3.10"
keywords = ["geoguessr", "openguessr", "geolocation", "streetclip", "computer-vision", "bot"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "numpy>=1.26",
    "pillow>=10",
    "opencv-python>=4.8,<5",
    "mss>=10",
    "pyautogui>=0.9.54",
    "pynput>=1.7",
    "global-land-mask>=1.0",
    "torch>=2.2",
    "transformers>=5",
    "huggingface_hub>=1",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "pandas>=2",
    "tqdm>=4.66",
    "rapidocr>=3.9,<3.10",  # 3.10 no longer hands out its detector and recogniser
    "onnxruntime>=1.20",
    "openvino>=2025.0",
]

[project.urls]
Homepage = "https://github.com/andrey-rublev/geoguessr-AI"
Download = "https://github.com/andrey-rublev/geoguessr-AI/releases/latest"
Issues = "https://github.com/andrey-rublev/geoguessr-AI/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
browser = ["playwright>=1.40"]

[project.scripts]
geoguessr-ai = "geoguessr_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
geoguessr_ai = ["knowledge/*.png", "knowledge/*.txt", "knowledge/*.json", "desktop.html", "desktop.ico"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# A frozen dataclass: safe as a default.
extend-immutable-calls = ["geoguessr_ai.config.Point", "geoguessr_ai.botrun.Choices"]

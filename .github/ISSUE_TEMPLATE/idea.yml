name: Idea
description: Something it could do better, or do at all
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What should it do, and when would you use it?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What does it do now, and what's in the way?
